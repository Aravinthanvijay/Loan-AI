version: '3.8'

services:
  # MongoDB Database (no auth for local dev)
  mongodb:
    image: mongo:7.0
    container_name: loan_ai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - loan_ai_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local

networks:
  loan_ai_network:
    driver: bridge
